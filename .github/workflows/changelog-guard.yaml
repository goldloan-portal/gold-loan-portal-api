name: Changelog guard

on:
  pull_request:
    branches: [dev]

jobs:
  changelog-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog entries land under [Unreleased]
        run: ./scripts/check-changelog-section.sh --base "${{ github.event.pull_request.base.sha }}"
